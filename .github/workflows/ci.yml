name: Verify FormFlow
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: formflow_test
          MYSQL_USER: formflow
          MYSQL_PASSWORD: test-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -uroot -ptest-root-password" --health-interval=10s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://formflow:test-password@127.0.0.1:3306/formflow_test
      REDIS_URL: redis://127.0.0.1:6379/15
      DATA_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      RECORD_DELAY_MS: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:services
      - run: npm run test:e2e

name: Verify FormFlow
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: mongodb://127.0.0.1:27017/formflow_test?replicaSet=rs0&directConnection=true
      QUEUE_BACKEND: mongodb
      DATA_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      RECORD_DELAY_MS: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Start MongoDB replica set
        run: |
          docker run -d --name formflow-mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec formflow-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'; then break; fi
            sleep 2
          done
          docker exec formflow-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}); while (!db.hello().isWritablePrimary) { sleep(500) }'
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:push
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:services
      - run: npm run test:e2e
